llm_configuration:
  llm_base_url: <YOUR_BASE_URL>
  llm_api_key: <YOUR_API_KEY>
  models:
    base:
      model_name: <YOUR_BASE_MODEL_NAME>
      stream: False
      max_tokens: 8192
      temperature: 1.0
      top_p: 0.95
    reason:
      model_name: <YOUR_REASONING_MODEL_NAME>
      stream: False
      max_tokens: 5120
      temperature: 1.0
      top_p: 0.95
    light:
      model_name: <YOUR_LIGHT_MODEL_NAME>
      stream: False
      max_tokens: 1024
      temperature: 0.7
      top_p: 0.95
    vlm:
      model_name: <YOUR_VLM_MODEL_NAME>
      stream: False
      max_tokens: 1024
      temperature: 0.7
      top_p: 0.95

application_settings:
  log_level: INFO
  log_dir: ./output/logs
  results_dir: ./output/results
  default_language: en
  max_retries: 3
  default_currency: USD

database_configuration:
  docs_path: ./data/docs
  vector_db_path: ./data/vector_store
  tfidf_path: ./data/tfidf
  embedding_model: <YOUR_EMBEDDING_MODEL>
  embedding_type: <YOUR_EMBEDDING_TYPE>
  chunk_size: 1024
  chunk_overlap": 256
  fuzzy_k: 1000
  semantic_k: 5
